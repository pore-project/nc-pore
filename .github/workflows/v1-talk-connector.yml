name: V1 Talk Connector

on:
  push:
    branches:
      - feat/v1-talk-recording-ui
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check browser scripts
        run: |
          node --check js/pore-recording-controller.js
          node --check js/pore-talk-audio-connector.js
          node --check js/pore-talk-recording-ui.js
          node --check js/init.js

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio development dependency
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check workspace
        run: cargo check --workspace
      - name: Test workspace
        run: cargo test --workspace
      - name: Check formatting
        run: cargo fmt --all -- --check
