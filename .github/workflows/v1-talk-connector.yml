name: V1 Talk Connector

on:
  push:
    branches:
      - fix-v1-final
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Node version
        run: node --version
      - name: Syntax check browser scripts
        run: |
          node --check js/init.js
          node --check js/pore-browser-completion-job.js
          node --check js/pore-browser-pcm-persistence.js
          node --check js/pore-browser-pcm-recorder.js
          node --check js/pore-browser-pcm-worklet.js
          node --check js/pore-browser-runtime-transport.js
          node --check js/pore-recording-controller.js
          node --check js/pore-talk-audio-connector.js
          node --check js/pore-talk-recording-ui.js
          node --check js/pore-talk-settings.js
