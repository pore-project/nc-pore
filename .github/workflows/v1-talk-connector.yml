name: V1 Talk Connector

on:
  push:
    branches:
      - feat/v1-nextcloud-runtime-adapter
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check browser scripts
        run: |
          node --check js/init.js
          node --check js/pore-browser-completion-job.js
          node --check js/pore-browser-pcm-persistence.js
          node --check js/pore-browser-pcm-recorder.js
          node --check js/pore-browser-runtime-transport.js
          node --check js/pore-recording-controller.js
          node --check js/pore-talk-audio-connector.js
          node --check js/pore-talk-recording-ui.js
          node --check js/pore-talk-settings.js

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Syntax check Nextcloud PHP boundary
        run: |
          php -l lib/AppInfo/Application.php
          php -l lib/Controller/RecordingTransportController.php
          php -l lib/Controller/SettingsController.php
          php -l lib/Service/NextcloudArtifactPath.php
          php -l lib/Service/NextcloudArtifactStorage.php
          php -l tools/nextcloud-v1-contract-check.php
      - name: Run Nextcloud V1 path contract checks
        run: php tools/nextcloud-v1-contract-check.php

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio development dependency
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check workspace
        run: cargo check --workspace
      - name: Test workspace
        run: cargo test --workspace
      - name: Check formatting
        run: cargo fmt --all -- --check
