name: V1 Talk Connector

on:
  push:
    branches:
      - develop
      - fix-v1-final
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Node version
        run: node --version
      - name: Syntax check browser scripts
        run: |
          node --check js/init.js
          node --check js/pore-browser-completion-job.js
          node --check js/pore-browser-pcm-persistence.js
          node --check js/pore-browser-pcm-recorder.js
          node --check js/pore-browser-pcm-worklet.js
          node --check js/pore-browser-runtime-transport.js
          node --check js/pore-recording-controller.js
          node --check js/pore-recording-coordination.js
          node --check js/pore-talk-audio-connector.js
          node --check js/pore-talk-recording-ui.js
          node --check js/pore-talk-settings.js
      - name: Run browser JavaScript tests
        run: |
          node --experimental-default-type=module --input-type=module -e 'Object.defineProperty(globalThis, "navigator", { value: { mediaDevices: {} }, configurable: true, writable: true }); await import("./tools/js-test-harness.mjs")'

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Syntax check Nextcloud PHP boundary
        run: |
          php -l lib/AppInfo/Application.php
          php -l lib/Controller/RecordingTransportController.php
          php -l lib/Controller/RecordingCoordinationController.php
          php -l lib/Http/CoordinationEventStreamResponse.php
          php -l lib/Service/RecordingCoordinationService.php
          php -l lib/Controller/SettingsController.php
          php -l lib/Service/NextcloudArtifactPath.php
          php -l lib/Service/NextcloudArtifactConnector.php
          php -l lib/Service/ArtifactManifestStore.php
          php -l tools/nextcloud-v1-contract-check.php
          php -l tools/artifact-manifest-store-contract-check.php
      - name: Run Nextcloud V1 path contract checks
        run: |
          php tools/nextcloud-v1-contract-check.php
          php tools/nextcloud-artifact-connector-contract-check.php
          php tools/artifact-manifest-store-contract-check.php

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Install audio development dependency
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check workspace
        run: cargo check --workspace
      - name: Test workspace
        run: cargo test --workspace
      - name: Check formatting
        run: cargo fmt --all -- --check
