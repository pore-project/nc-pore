name: Temporary CI Fix

on:
  push:
    branches:
      - feat/session-client-vertical-slice

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-client-vertical-slice
          fetch-depth: 0
      - name: Fix mutable repository access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("application/src/bin/session_client_vertical_slice.rs")
          text = path.read_text()
          old = "let client = ClientSessionService::new(&state.repository);"
          new = "let client = ClientSessionService::new(&mut state.repository);"
          if old not in text:
              raise SystemExit("target expression not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit fix
        run: |
          git config user.name "Pore Project"
          git config user.email "pore@mediaoffice-zimmer.de"
          git add application/src/bin/session_client_vertical_slice.rs
          git commit -m "fix: use mutable session repository access"
          git push origin HEAD:feat/session-client-vertical-slice
