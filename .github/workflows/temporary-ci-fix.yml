name: Temporary CI Fix

on:
  push:
    branches:
      - feat/session-client-vertical-slice

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/session-client-vertical-slice
          fetch-depth: 0
      - name: Fix mutable repository access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("application/src/bin/session_client_vertical_slice.rs")
          text = path.read_text()
          old = "fn get_session_or_context(path: &str, state: &ServerState) -> (u16, &'static str, String) {"
          new = "fn get_session_or_context(path: &str, state: &mut ServerState) -> (u16, &'static str, String) {"
          if old not in text:
              raise SystemExit("target signature not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit fix
        run: |
          git config user.name "Pore Project"
          git config user.email "pore@mediaoffice-zimmer.de"
          git add application/src/bin/session_client_vertical_slice.rs
          git commit -m "fix: allow mutable session client access"
          git push origin HEAD:feat/session-client-vertical-slice
