name: Temporary Test Fix

on:
  push:
    branches:
      - feat/session-client-vertical-slice

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-client-vertical-slice
          fetch-depth: 0
      - name: Fix test calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("application/src/bin/session_client_vertical_slice.rs")
          text = path.read_text()
          replacements = {
              'get_session_or_context("/api/sessions/vertical-slice-session", &state)':
                  'get_session_or_context("/api/sessions/vertical-slice-session", &mut state)',
              '"/api/sessions/vertical-slice-session/context?actor=bob-1",\n            &state,':
                  '"/api/sessions/vertical-slice-session/context?actor=bob-1",\n            &mut state,',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"target not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit fix
        run: |
          git config user.name "Pore Project"
          git config user.email "pore@mediaoffice-zimmer.de"
          git add application/src/bin/session_client_vertical_slice.rs
          git commit -m "fix: update mutable session test calls"
          git push origin HEAD:feat/session-client-vertical-slice
