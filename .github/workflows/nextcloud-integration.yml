name: Nextcloud Integration Test

on:
  workflow_dispatch:

jobs:
  nextcloud-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Run Nextcloud runtime reality check
        env:
          NC_PORE_NEXTCLOUD_URL: ${{ secrets.NC_PORE_NEXTCLOUD_URL }}
          NC_PORE_NEXTCLOUD_USER: ${{ secrets.NC_PORE_NEXTCLOUD_USER }}
          NC_PORE_NEXTCLOUD_APP_PASSWORD: ${{ secrets.NC_PORE_NEXTCLOUD_APP_PASSWORD }}
          NC_PORE_NEXTCLOUD_REMOTE_ROOT: ${{ secrets.NC_PORE_NEXTCLOUD_REMOTE_ROOT }}
        run: cargo test --workspace --test nextcloud_reality_check -- --nocapture

      - name: Run Nextcloud real recording reality check
        env:
          NC_PORE_NEXTCLOUD_URL: ${{ secrets.NC_PORE_NEXTCLOUD_URL }}
          NC_PORE_NEXTCLOUD_USER: ${{ secrets.NC_PORE_NEXTCLOUD_USER }}
          NC_PORE_NEXTCLOUD_APP_PASSWORD: ${{ secrets.NC_PORE_NEXTCLOUD_APP_PASSWORD }}
          NC_PORE_NEXTCLOUD_REMOTE_ROOT: ${{ secrets.NC_PORE_NEXTCLOUD_REMOTE_ROOT }}
        run: cargo test --workspace --test nextcloud_real_recording_reality_check -- --nocapture
