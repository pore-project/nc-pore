name: Temporary Test Diagnostic

on:
  push:
    branches:
      - feat/session-client-vertical-slice

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-client-vertical-slice
          fetch-depth: 0
      - name: Install dependencies
        run: |
          set -euo pipefail
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            [ -f "$file" ] || continue
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$file"
          done
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-diagnostic.txt
      - name: Commit diagnostic
        if: steps.test.outcome == 'failure'
        run: |
          git config user.name "Pore Project"
          git config user.email "pore@mediaoffice-zimmer.de"
          git add test-diagnostic.txt
          git commit -m "chore: capture current test diagnostic"
          git push origin HEAD:feat/session-client-vertical-slice
