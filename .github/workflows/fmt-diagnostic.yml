name: Temporary Rustfmt Diagnostic
on:
  push:
    branches:
      - feat/v1-nextcloud-runtime-adapter
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Capture diff
        run: git diff --binary > rustfmt.diff
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diff
          path: rustfmt.diff
