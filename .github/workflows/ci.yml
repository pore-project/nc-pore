name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Ubuntu package mirror
        run: |
          set -euo pipefail
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            [ -f "$file" ] || continue
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$file"
          done
          if sudo grep -R 'azure.archive.ubuntu.com' /etc/apt/sources.list /etc/apt/sources.list.d /etc/apt/apt-mirrors.txt 2>/dev/null; then
            echo 'Unreplaced Azure Ubuntu mirror reference found.'
            exit 1
          fi

      - name: Install system dependencies
        run: |
          set -euo pipefail
          # The GitHub-hosted runner may contain unrelated third-party apt
          # repositories. Restrict the update to Ubuntu sources so a transient
          # failure in an unrelated repository cannot block our build.
          sudo apt-get update \
            -o Dir::Etc::sourcelist="/etc/apt/sources.list" \
            -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Architecture checks
        run: ./tools/architecture-checks/run-all.sh
