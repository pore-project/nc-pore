name: Benchmarks

on:
  push:
    branches:
      - 'perf/**'

jobs:
  payload-hash:
    name: Payload hash benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recorder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Ubuntu package mirror
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run payload hash benchmark
        run: cargo bench --bench payload_hash
