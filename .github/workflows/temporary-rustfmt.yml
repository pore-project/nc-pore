name: Temporary Rustfmt Repair

on:
  push:
    branches:
      - feat/session-client-vertical-slice

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/session-client-vertical-slice
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "Pore Project"
          git config user.email "pore@mediaoffice-zimmer.de"
          git add -A
          git commit -m "style: format session client vertical slice"
          git push origin HEAD:feat/session-client-vertical-slice
