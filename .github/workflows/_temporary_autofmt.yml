name: Temporary PR autofmt

on:
  push:
    branches:
      - fix/session-recording-activate-session

permissions:
  contents: write

jobs:
  autofmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/session-recording-activate-session
          fetch-depth: 0

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Repair injected session activation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("application/src/bin/session_recording_vertical_slice.rs")
          text = path.read_text()
          bad = '''    let mut session = repository\n    session.start_by(&owner).expect("vertical-slice session must be active before recording");\n        .get(&production_id)\n'''
          good = '''    let mut session = repository\n        .get(&production_id)\n'''
          if bad not in text:
              raise SystemExit("expected malformed session initialization not found")
          text = text.replace(bad, good, 1)
          marker = '''        .expect("vertical-slice session must exist");\n    session\n'''
          replacement = '''        .expect("vertical-slice session must exist");\n    session\n        .start_by(&owner)\n        .expect("vertical-slice session must be active before recording");\n    session\n'''
          if marker not in text:
              raise SystemExit("expected session lookup marker not found")
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY

      - name: Format Rust
        run: cargo fmt --all

      - name: Commit formatted source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary_autofmt.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes needed after repair/format."
            exit 0
          fi
          git commit -m "style: format session recording vertical slice"
          git push origin HEAD:fix/session-recording-activate-session
