name: Temporary Test Diagnostic
on:
  push:
    branches:
      - feat/v1-nextcloud-runtime-adapter
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Cargo test
        run: |
          set +e
          cargo test --workspace > cargo-test.log 2>&1
          status=$?
          tail -n 250 cargo-test.log
          echo "$status" > cargo-test.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-test-diagnostic
          path: |
            cargo-test.log
            cargo-test.status
